[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "engrebodds-ingest"
version = "0.1.0"
description = "API-Football ingestion jobs for Engrebodds"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["engrebodds_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
