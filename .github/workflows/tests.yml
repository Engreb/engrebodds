# Database (pgTAP) and Python tests against a throwaway local Supabase database.
# Runs on pull requests and pushes to main only, to save Actions minutes for ingestion.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start Postgres and apply migrations
        run: supabase db start

      - name: Database tests
        run: supabase test db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ingest/pyproject.toml
            model/pyproject.toml

      - run: pip install -e "./ingest[dev]" -e "./model[dev]"

      - name: Python tests (including the ones against the database)
        run: pytest -q ingest

      - name: Model tests
        run: pytest -q model
